name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.20.0', '24', '26']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prettier
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: pnpm format:check

      - name: Tests
        run: pnpm test

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check gofmt
        working-directory: go
        run: |
          files=$(gofmt -l $(find . -type f -name '*.go'))
          if [ -n "$files" ]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Test
        working-directory: go
        run: go test ./... -count=1

      - name: Race detector
        working-directory: go
        run: go test -race ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Install smoke test
        working-directory: go
        run: |
          mkdir -p "$RUNNER_TEMP/skills-bin"
          GOBIN="$RUNNER_TEMP/skills-bin" go install ./cmd/skills
          "$RUNNER_TEMP/skills-bin/skills" --version
