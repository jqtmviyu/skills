name: Release Go binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Cross-compile release binaries
        working-directory: go
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          OUTPUT="$RUNNER_TEMP/skills-release"
          mkdir -p "$OUTPUT"
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            SUFFIX=""
            if [ "$GOOS" = windows ]; then SUFFIX=".exe"; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$OUTPUT/skills-$GOOS-$GOARCH$SUFFIX" ./cmd/skills
          done

      - name: Upload binaries to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/skills-release/* --clobber --repo "$GITHUB_REPOSITORY"
